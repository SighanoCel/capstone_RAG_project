# Render blueprint for the "Ask to Celestin" chat API (portfolio assistant).
services:
  - type: web
    name: ask-celestin
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-celestin.txt
    startCommand: uvicorn api_celestin:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: OPENAI_API_KEY
        sync: false
